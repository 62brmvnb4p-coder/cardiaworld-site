name: Verify scrollable world snapshots
on:
  push:
    branches: [website/world-snapshots]
permissions: {contents: read}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --test .github/tests/*.test.mjs
      - name: Check actual 3D snapshots at iPhone width
        run: |
          npm install --prefix "$RUNNER_TEMP/community-browser" --no-audit --no-fund playwright@1.56.1
          python3 -m http.server 4193 --bind 127.0.0.1 > "$RUNNER_TEMP/community-http.log" 2>&1 &
          export CHROME_PATH="$(command -v google-chrome)"
          test -n "$CHROME_PATH"
          NODE_PATH="$RUNNER_TEMP/community-browser/node_modules" node .github/tests/community-browser.cjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: community-mobile-qa
          path: website-preview-mobile.png
