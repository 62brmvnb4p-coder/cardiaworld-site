<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081c33">
  <meta name="robots" content="noindex">
  <title>Email confirmed · Cardia World</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #f7fbff; background: linear-gradient(160deg,#081c33,#174d70); font: 16px/1.5 system-ui,-apple-system,sans-serif; }
    main { width: min(100%,480px); padding: 36px; border: 1px solid #ffffff30; border-radius: 24px; background: #ffffff12; box-shadow: 0 24px 70px #0003; }
    img { width: 80px; height: 80px; object-fit: contain; }
    h1 { font-size: clamp(27px,7vw,38px); line-height: 1.15; margin: 24px 0 12px; }
    p { color: #c6dae7; margin: 0 0 20px; }
    a { color: #f5d369; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/images/cardia-world-icon-512.png" alt="">
    <h1>Email confirmed.</h1>
    <p>Your Cardia World account is ready. Return to the app and sign in with your email and password to keep building your world.</p>
    <a href="/">Visit Cardia World</a>
  </main>
</body>
</html>
